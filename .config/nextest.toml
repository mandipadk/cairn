# `cargo nextest run` runs every test in its own process, all suites at
# once, and refuses to let one hung test hold the rest hostage.
[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 0

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
junit = { path = "junit.xml" }
