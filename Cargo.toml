[workspace]
resolver = "3"
members = ["crates/core", "crates/git", "crates/server", "crates/client", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/mandipadk/cairn"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "debuginfo"
