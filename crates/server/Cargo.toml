[package]
name = "cairn-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
cairn-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
