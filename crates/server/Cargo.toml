[package]
name = "cairn-server"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
sha2 = "0.11.0"
jsonwebtoken = "9"
ureq = { version = "3.4.0", features = ["json"] }
webauthn-rs = { version = "0.5", features = ["resident-key-support", "conditional-ui", "danger-allow-state-serialisation"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "pool", "rustls", "ring", "webpki-roots"] }
jiff = "0.2.35"
axum = "0.8.9"
base64 = "0.23.1"
cairn-core = { version = "0.1.0", path = "../core" }
cairn-git = { version = "0.1.0", path = "../git" }
flate2 = "1.1.9"
maud = { version = "0.27.0", features = ["axum"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
